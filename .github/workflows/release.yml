name: Release

# Push a version tag (e.g. `npm version 0.2.0 && git push --follow-tags`)
# to build the Windows installers and publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app

      - run: npm ci

      - name: Test
        run: cargo test --manifest-path app/Cargo.toml

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Overlay Manager ${{ github.ref_name }}
          releaseBody: |
            Download **Overlay Manager_*_x64-setup.exe** (recommended) or the **.msi** below.

            Windows may show a SmartScreen warning because the installer isn't code-signed: choose "More info" → "Run anyway".
          releaseDraft: false
          prerelease: false
